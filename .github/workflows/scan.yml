name: Scan for flight deals

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours
  workflow_dispatch:          # lets you run it by hand from the Actions tab

concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: write   # to push quarterly summaries to the `history` branch
  actions: write    # to find database backups, and to keep the schedule from being auto-disabled

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Working database (the last year of individual prices). Each run restores
      # the newest copy from the Actions cache and saves a new one.
      - name: Restore price database
        uses: actions/cache/restore@v4
        with:
          path: data/prices.sqlite
          key: prices-${{ github.run_id }}
          restore-keys: prices-

      - name: Restore from newest backup if the cache is gone
        if: hashFiles('data/prices.sqlite') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '
            [.artifacts[] | select(.name | startswith("prices-backup-")) | select(.expired | not)]
            | sort_by(.created_at) | last | .id // empty')
          if [ -z "$id" ]; then echo "No backup found; starting fresh"; exit 0; fi
          mkdir -p data
          gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > backup.zip
          unzip -o backup.zip -d data && gunzip -f data/prices.sqlite.gz && rm backup.zip
          echo "Restored database from backup artifact $id"

      # Long-term quarterly summaries live on the `history` branch, forever.
      - name: Check out history branch
        run: |
          if git fetch --depth=1 origin history:refs/remotes/origin/history; then
            git worktree add -B history history-tree origin/history
          else
            git worktree add --orphan -b history history-tree
          fi

      - name: Scan and email deals
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ORIGINS: ${{ vars.ORIGINS || 'SFO,SJC' }}
          HISTORY_DIR: history-tree/quarterly
        run: python -m cheapflights run

      - name: Save price database
        if: always() && hashFiles('data/prices.sqlite') != ''
        uses: actions/cache/save@v4
        with:
          path: data/prices.sqlite
          key: prices-${{ github.run_id }}

      - name: Push new quarterly summaries
        if: always()
        working-directory: history-tree
        run: |
          git add -A
          if git diff --cached --quiet; then echo "No new quarters"; exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Quarterly price summaries $(date -u +%F)"
          git push origin history

      # GitHub disables scheduled workflows in public repos after 60 days with no
      # repository activity. Quarterly commits aren't frequent enough, so re-enable
      # this workflow through the API on each run (the same approach the popular
      # keepalive-workflow action uses).
      - name: Keep schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/scan.yml/enable" || true

      # The cache is only lost if no run happens for 7 days, so a daily copy is
      # plenty: first run after midnight UTC, plus every manual run.
      - name: Check if backup is due
        id: backup
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ "$(date -u +%H)" -lt 4 ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compress database for backup
        if: steps.backup.outputs.due == 'true' && hashFiles('data/prices.sqlite') != ''
        run: gzip -k -f data/prices.sqlite

      - name: Back up price database
        if: steps.backup.outputs.due == 'true' && hashFiles('data/prices.sqlite.gz') != ''
        uses: actions/upload-artifact@v4
        with:
          name: prices-backup-${{ github.run_id }}
          path: data/prices.sqlite.gz
          retention-days: 7
